name: Windows release

# Every push to master builds and publishes the next release (one patch above the latest; the csproj <Version> is the
# minimum). Put [skip release] in the head commit message to push without releasing. Run it by hand with publish off to
# build and package any branch without releasing; the files are uploaded as a workflow artifact instead.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release (only from master). Off builds and packages, then uploads the files as an artifact.
        type: boolean
        default: true

permissions:
  contents: write

# Publishing runs queue one at a time so versions and the FFmpeg runtime chain stay in order. Dry runs don't wait for them.
concurrency:
  group: ${{ (github.event_name == 'push' || inputs.publish) && github.ref == 'refs/heads/master' && 'windows-releases' || format('windows-release-dry-run-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]')
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH: ${{ (github.event_name == 'push' || inputs.publish) && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Select the next release version
        id: version
        shell: pwsh
        run: |
          ./tools/release-version.ps1 | Out-Null
          if ($env:PUBLISH -ne 'true') {
            $reason = if ('${{ inputs.publish }}' -eq 'true') { 'Releases publish only from master, so this is a dry run.' } else { 'Dry run: nothing will be published.' }
            Write-Host "::notice::$reason The packaged files are uploaded as a workflow artifact."
          }
      - name: Restore pinned FFmpeg runtime from the previous release
        shell: pwsh
        run: ./tools/restore-ffmpeg.ps1 -Repository $env:GITHUB_REPOSITORY
      # Every push to master ships to every installed copy, so a recorder that can't record never gets packaged.
      - name: Build and self-test
        shell: pwsh
        run: ./tools/selftest.ps1
      - name: Build installer and update packages
        id: package
        shell: pwsh
        run: ./tools/package-release.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Verify release files
        shell: pwsh
        run: ./tools/verify-release.ps1 -ReleaseDir '${{ steps.package.outputs.release_dir }}' -Version '${{ steps.version.outputs.version }}'
      - name: Upload dry-run packages
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Framelock-${{ steps.version.outputs.version }}-dry-run
          path: ${{ steps.package.outputs.release_dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Publish GitHub release
        id: publish
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          RELEASE_DIR: ${{ steps.package.outputs.release_dir }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:TAG" --silent 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Tag $env:TAG already exists; not attaching a release to another commit." }
          @'
          Download **Framelock-win-Setup.exe** to install, or **Framelock-win-Portable.zip** for a portable copy. Installed copies download this update automatically and apply it the next time you open Framelock.
          '@ | Set-Content -LiteralPath release-notes.md -Encoding utf8
          $assets = Get-ChildItem -LiteralPath $env:RELEASE_DIR -File
          # Upload everything to a draft first, so a half-uploaded release never becomes the latest one.
          gh release create $env:TAG @($assets.FullName) --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Framelock $env:TAG" --notes-file release-notes.md --generate-notes --draft
          if ($LASTEXITCODE) { throw 'Release upload failed; nothing was published.' }
          "draft_created=true" >> $env:GITHUB_OUTPUT
          $uploaded = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Could not read the draft release.' }
          foreach ($asset in $assets) {
            if (!($uploaded.assets | Where-Object { $_.name -eq $asset.Name -and $_.size -eq $asset.Length })) { throw "Draft release is missing $($asset.Name)." }
          }
          gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE) { throw 'Could not publish the completed release.' }
          Write-Host "Published $env:TAG from $env:GITHUB_SHA"
      # Only ever removes the draft this run created.
      - name: Remove an unpublished draft
        if: failure() && steps.publish.outputs.draft_created == 'true'
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $draft = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft 2>$null
          if ($draft -eq 'true') { gh release delete $env:TAG --repo $env:GITHUB_REPOSITORY --yes }
          $global:LASTEXITCODE = 0
