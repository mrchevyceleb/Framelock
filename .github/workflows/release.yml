name: Windows release

# Every push to master builds and publishes the next release (one patch above the latest; the csproj <Version> is the
# minimum). Put [skip release] in the head commit message to push without releasing. Run it by hand with publish off to
# build and package any branch without releasing; the files are uploaded as a workflow artifact instead.
#
# Only the two small jobs that pick the version and publish can write to the repo, and they install nothing. The build,
# which restores NuGet packages and runs the recorder, only reads.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release (only from master). Off builds and packages, then uploads the files as an artifact.
        type: boolean
        default: true

permissions:
  contents: read

# Publishing runs go one at a time so versions and the FFmpeg runtime chain stay in order. GitHub keeps one waiting run,
# so pushes made while a release builds ship together in the next one. Dry runs and skipped pushes get their own group,
# so they never take a waiting release's place.
concurrency:
  group: ${{ ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip release]')) || inputs.publish) && github.ref == 'refs/heads/master' && 'windows-releases' || format('windows-release-other-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ (github.event_name == 'push' || inputs.publish) && github.ref == 'refs/heads/master' }}

jobs:
  plan:
    name: Pick the version
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Draft releases are only visible with write access.
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the next release version
        id: version
        shell: pwsh
        run: |
          ./tools/release-version.ps1 | Out-Null
          # Stop a publishing run before the build if it could never publish.
          if ($env:PUBLISH -eq 'true') { ./tools/release-guard.ps1 -Commit $env:GITHUB_SHA }
          else {
            $reason = if ('${{ inputs.publish }}' -eq 'true') { 'Releases publish only from master, so this is a dry run.' } else { 'Dry run: nothing will be published.' }
            Write-Host "::notice::$reason The packaged files are uploaded as a workflow artifact."
          }

  build:
    name: Build and package
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }} # Read-only here: it downloads the previous release's FFmpeg runtime.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore pinned FFmpeg runtime from the previous release
        shell: pwsh
        run: ./tools/restore-ffmpeg.ps1 -Repository $env:GITHUB_REPOSITORY
      # Every push to master ships to every installed copy, so a recorder that can't record never gets packaged.
      - name: Build and self-test
        shell: pwsh
        run: ./tools/selftest.ps1
      - name: Build installer and update packages
        id: package
        shell: pwsh
        run: ./tools/package-release.ps1 -Version '${{ needs.plan.outputs.version }}'
      - name: Verify release files
        shell: pwsh
        run: ./tools/verify-release.ps1 -ReleaseDir '${{ steps.package.outputs.release_dir }}' -Version '${{ needs.plan.outputs.version }}'
      # Dry runs keep these for a week; a publishing run hands them to the publish job.
      - name: Keep the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Framelock-${{ needs.plan.outputs.version }}${{ env.PUBLISH != 'true' && '-dry-run' || '' }}
          path: ${{ steps.package.outputs.release_dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ env.PUBLISH == 'true' && 1 || 7 }}

  publish:
    name: Publish
    needs: [plan, build]
    if: (github.event_name == 'push' || inputs.publish) && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      # Only the release scripts run here; no packages are restored.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Framelock-${{ needs.plan.outputs.version }}
          path: release
      - name: Publish GitHub release
        id: publish
        shell: pwsh
        run: |
          ./tools/verify-release.ps1 -ReleaseDir release -Version $env:VERSION
          ./tools/release-guard.ps1 -Commit $env:GITHUB_SHA
          $repo = $env:GITHUB_REPOSITORY
          $current = gh api "repos/$repo/releases/latest" --jq .tag_name 2>$null
          if ($LASTEXITCODE -eq 0 -and [version]$current.TrimStart('v') -ge [version]$env:VERSION) { throw "$current is already out, so $env:TAG would be a step back." }
          $global:LASTEXITCODE = 0
          $probe = gh api "repos/$repo/git/ref/tags/$env:TAG" 2>&1
          if ($LASTEXITCODE -eq 0) { throw "Tag $env:TAG already exists; not attaching a release to another commit." }
          if ("$probe" -notmatch 'HTTP 404') { throw "Could not check whether $env:TAG exists: $probe" }
          # A draft's tag doesn't exist until it publishes, so also look for any release already using this tag.
          $existing = gh api --paginate "repos/$repo/releases?per_page=100" --jq ('.[] | select(.tag_name == "' + $env:TAG + '") | .id')
          if ($LASTEXITCODE) { throw 'Could not list existing releases.' }
          if ($existing) { throw "A release already uses $env:TAG; leaving it alone." }
          $body = 'Download **Framelock-win-Setup.exe** to install, or **Framelock-win-Portable.zip** for a portable copy. Installed copies download this update automatically and apply it the next time you open Framelock.'
          # Upload everything to a draft first, so a half-uploaded release never becomes the latest one. The draft's id is
          # recorded the moment it exists, so cleanup only ever removes this run's own draft.
          $draft = gh api -X POST "repos/$repo/releases" -f "tag_name=$env:TAG" -f "target_commitish=$env:GITHUB_SHA" -f "name=Framelock $env:TAG" -f "body=$body" -F draft=true -F generate_release_notes=true | ConvertFrom-Json
          if ($LASTEXITCODE -or !$draft.id) { throw 'Could not create the draft release.' }
          "release_id=$($draft.id)" >> $env:GITHUB_OUTPUT
          # Tag lookups and the release list lag a new draft by a few seconds, so upload to the draft's id. curl streams
          # each file with its length and reads the token from stdin, never the command line.
          $uploadUrl = $draft.upload_url -replace '\{.*\}$', ''
          $files = @(Get-ChildItem -LiteralPath release -File)
          if (!$files) { throw 'No release files to upload.' }
          foreach ($file in $files) {
            $response = "header = `"Authorization: Bearer $env:GH_TOKEN`"" | curl -fsS --config - -X POST -H 'Content-Type: application/octet-stream' -T $file.FullName "$($uploadUrl)?name=$([uri]::EscapeDataString($file.Name))"
            if ($LASTEXITCODE) { throw "Uploading $($file.Name) failed; nothing was published." }
            $asset = $response | ConvertFrom-Json
            $hash = 'sha256:' + (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            # The upload response normally carries the digest; if GitHub is still hashing, ask again by the asset's id.
            for ($try = 0; !$asset.digest -and $try -lt 10; $try++) {
              Start-Sleep -Seconds 3
              $read = gh api "repos/$repo/releases/assets/$($asset.id)" 2>$null
              if ($LASTEXITCODE -eq 0) { $asset = $read | ConvertFrom-Json }
              $global:LASTEXITCODE = 0
            }
            if ($asset.name -ne $file.Name -or $asset.state -ne 'uploaded' -or $asset.size -ne $file.Length -or $asset.digest -ne $hash) { throw "Draft release has a missing or damaged $($file.Name)." }
          }
          gh api -X PATCH "repos/$repo/releases/$($draft.id)" -F draft=false -f make_latest=true --silent
          if ($LASTEXITCODE) { throw 'Could not publish the completed release.' }
          $live = gh api "repos/$repo/releases/$($draft.id)" | ConvertFrom-Json
          if ($LASTEXITCODE -or $live.draft -or $live.prerelease -or $live.tag_name -ne $env:TAG -or $live.target_commitish -ne $env:GITHUB_SHA) { throw "GitHub did not confirm $env:TAG as published." }
          # The latest-release lookup can trail the publish by a few seconds.
          for ($try = 0; $try -lt 10; $try++) {
            $latest = gh api "repos/$repo/releases/latest" --jq .id 2>$null
            if ($LASTEXITCODE -eq 0 -and "$latest" -eq "$($draft.id)") { break }
            $global:LASTEXITCODE = 0
            Start-Sleep -Seconds 3
          }
          if ("$latest" -ne "$($draft.id)") { throw "$env:TAG is published but GitHub has not made it the latest release. Check the releases page." }
          Write-Host "Published $env:TAG from $env:GITHUB_SHA"
      - name: Remove this run's unpublished draft
        if: failure() && steps.publish.outputs.release_id != ''
        shell: pwsh
        env:
          RELEASE_ID: ${{ steps.publish.outputs.release_id }}
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -eq 0 -and $release.draft) { gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" --silent }
          $global:LASTEXITCODE = 0
