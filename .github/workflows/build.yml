name: Build

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore pinned FFmpeg runtime from the latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/restore-ffmpeg.ps1
      - name: Build and self-test (record, pause, replay, remux and verify with ffprobe)
        shell: pwsh
        run: ./tools/selftest.ps1
